<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DECA AI Studio - NatureLab DEMO</title>
  <style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
  <iframe id="content-frame" src="./admin.html" title="NatureLab Creative Manager"></iframe>
  <script>
    const pages={admin:"./admin.html",detail:"./detail.html",detailV2:"./detail.html",detailV3:"./detail2.html",newCreate:"./generate.html"};
    const frame=document.getElementById("content-frame");
    window.addEventListener("message",event=>{if(event.data&&event.data.type==="hoholine:navigate"&&pages[event.data.page])frame.src=pages[event.data.page];});
  </script>
</body>
</html>
